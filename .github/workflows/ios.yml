# iPhone derlemesi bulut Mac'te (GitHub Actions macOS, herkese açık depoda ücretsiz).
# Şimdilik simülatör için derler: Kotlin + Swift kodunun iPhone'da derlendiğini doğrular.
# App Store'a yükleme için Apple Developer hesabı ve imza sertifikası gerekir (sonra eklenecek).
name: iOS derlemesi
on:
  workflow_dispatch:
  push:
    # Motor (cekirdek/) değişince derleme gerekmez: uygulamalar imzalı motoru siteden alır
    paths: ['kotlin/**', '.github/workflows/ios.yml']
permissions:
  contents: read
# Çalışan derleme iptal edilmez (uzun sürer); yenisi sırada bekler
concurrency: { group: ios, cancel-in-progress: false }
jobs:
  derle:
    runs-on: macos-15
    timeout-minutes: 75
    defaults: { run: { working-directory: kotlin } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (tarama.yml ile aynı)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Java 17 (macOS imajında hazır)
        run: echo "JAVA_HOME=${JAVA_HOME_17_arm64:-$JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
      - name: Çekirdek ve ilan listesi (uygulamanın içine giden dosyalar)
        run: |
          chmod +x gradlew
          mkdir -p composeApp/src/commonMain/composeResources/files
          node ../cekirdek/paketle.js composeApp/src/commonMain/composeResources/files
          node ../cekirdek/tur_denetim.js
          cp ../telefon/ilanlar.json composeApp/src/commonMain/composeResources/files/ilanlar.json
      - name: Kotlin iPhone çerçevesi (simülatör)
        run: ./gradlew --no-daemon :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Firebase ayar dosyası (gizli değişken varsa)
        env: { PLIST: '${{ secrets.IOS_FIREBASE_PLIST }}' }
        run: |
          if [ -n "$PLIST" ]; then
            printf '%s' "$PLIST" | tr -d '\r\n ' | base64 -D > iosApp/Sources/GoogleService-Info.plist
            plutil -lint iosApp/Sources/GoogleService-Info.plist && echo "yazıldı"
          else echo "yok, istatistiksiz derleniyor"; fi
      - name: Xcode projesini üret
        run: brew install xcodegen && cd iosApp && xcodegen generate
      - name: Uygulamayı derle (simülatör)
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild -project MemurOl.xcodeproj -scheme MemurOl -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build > derleme.log 2>&1 || {
              echo "=== HATALAR ==="; grep -nE "(: error:|^e: |What went wrong|^FAILURE|Execution failed|commands failed|Command .* failed)" -A4 derleme.log | grep -vE "(clang |Using response|ScanDependencies|builtin-)" | head -n 100
              echo "=== KOTLIN ADIMI (Xcode betiği çıktısı) ==="
              bas=$(grep -n "^PhaseScriptExecution Kotlin" derleme.log | tail -1 | cut -d: -f1)
              [ -n "$bas" ] && sed -n "${bas},$((bas+120))p" derleme.log | grep -vE "^\s+(cd |export |/bin/sh)" | head -n 120
              exit 1; }
          tail -n 5 derleme.log
      - name: Simülatörde aç — çökme kontrolü ve ekran görüntüleri (iPhone 6,9")
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -path '*Debug-iphonesimulator/MemurOl.app' | head -1)
          CIHAZ=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];L=[x for k,v in d.items() if 'iOS' in k for x in v if 'Pro Max' in x['name']];print(L[-1]['udid'])")
          echo "uygulama: $APP  cihaz: $CIHAZ"
          # Türkçe simülatör (sistem pencereleri ve tarih biçimi Türkçe)
          xcrun simctl boot "$CIHAZ"; xcrun simctl bootstatus "$CIHAZ" -b >/dev/null
          xcrun simctl spawn "$CIHAZ" defaults write -g AppleLanguages -array tr-TR
          xcrun simctl spawn "$CIHAZ" defaults write -g AppleLocale -string tr_TR
          xcrun simctl shutdown "$CIHAZ"; xcrun simctl boot "$CIHAZ"; xcrun simctl bootstatus "$CIHAZ" -b >/dev/null
          xcrun simctl status_bar "$CIHAZ" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$CIHAZ" "$APP"
          mkdir -p ../ekran
          ac() { xcrun simctl terminate "$CIHAZ" com.celikgames.memurol 2>/dev/null || true; env SIMCTL_CHILD_MEMUROL_GOSTERIM=1 "$@" xcrun simctl launch "$CIHAZ" com.celikgames.memurol; sleep 25; }
          ac SIMCTL_CHILD_MEMUROL_ISTATISTIK_SORMA=1;  xcrun simctl io "$CIHAZ" screenshot ../ekran/1_karsilama.png
          ac SIMCTL_CHILD_MEMUROL_ORNEK=1 SIMCTL_CHILD_MEMUROL_EKRAN=uygun;   xcrun simctl io "$CIHAZ" screenshot ../ekran/2_sana_uygun.png
          ac SIMCTL_CHILD_MEMUROL_EKRAN=ilanlar;  xcrun simctl io "$CIHAZ" screenshot ../ekran/3_ilanlar.png
          ac SIMCTL_CHILD_MEMUROL_EKRAN=profil;   xcrun simctl io "$CIHAZ" screenshot ../ekran/4_profil.png
          ac SIMCTL_CHILD_MEMUROL_EKRAN=sihirbaz; xcrun simctl io "$CIHAZ" screenshot ../ekran/5_bilgi_girisi.png
          ac SIMCTL_CHILD_MEMUROL_EKRAN=uygun SIMCTL_CHILD_MEMUROL_TEMA=koyu; xcrun simctl io "$CIHAZ" screenshot ../ekran/6_koyu_tema.png
          echo "=== ÇALIŞIYOR MU ==="; xcrun simctl spawn "$CIHAZ" launchctl list | grep -i memurol || echo "UYGULAMA ÇALIŞMIYOR — çökmüş olabilir"
          echo "=== HATA KAYITLARI ==="; xcrun simctl spawn "$CIHAZ" log show --last 3m --style compact --predicate 'process == "MemurOl"' 2>/dev/null | grep -iE "error|fault|crash|exception|uncaught|kotlin" | head -n 60 || true
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i memurol || echo "çökme raporu yok"
      - name: Ekran görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ekran-goruntuleri, path: ekran/, if-no-files-found: warn, retention-days: 14 }
