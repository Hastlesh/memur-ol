# Her sabah 08.17 (Türkiye) Resmî Gazete ilanlarını tarar, yeni ilanları yükler, siteyi günceller.
# Bildirimi Android uygulaması kendisi yapar. Eylemler commit koduna sabitli (tedarik zinciri güvenliği, OWASP Top 10).
name: Günlük ilan taraması
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: tarama
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tur
          pip install -q pymupdf==1.28.2
          cd yukleyici && npm ci --silent
      - name: Tara
        run: python -I yukleyici/tarama/otomatik.py | tee tarama.log
      - name: Yükle
        run: |
          python -I yukleyici/tarama/otomatik.py --yuklendi
          node yukleyici/ilanlar_yap.js
          node telefon/yap.js
          node telefon/site_yap.js
          node yukleyici/tarama/kontrol.js | tee -a tarama.log
      - name: Kaydet
        run: |
          git config user.name "Şartım Tamam tarayıcı"
          git config user.email "actions@users.noreply.github.com"
          git add -A yukleyici/kayitlar yukleyici/tarama/durum.json docs telefon/ilanlar.json
          git diff --cached --quiet && echo "değişiklik yok" || (git commit -q -m "İlan taraması $(date +%F)" && git push -q)
