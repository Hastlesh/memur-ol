# iPhone uygulaması — Xcode projesi bu dosyadan üretilir (Mac'te / bulut Mac'te: xcodegen generate)
# Kotlin kodu composeApp içindeki ComposeApp.framework olarak bağlanır.
name: MemurOl
options:
  bundleIdPrefix: com.celikgames
  deploymentTarget:
    iOS: "16.4"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 11.0.0
targets:
  MemurOl:
    type: application
    platform: iOS
    sources:
      - Sources
      # Firebase ayar dosyası yalnız varsa (depoda yok; CI gizli değişkenden yazar)
      - path: GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: GoogleMobileAds
      - target: MemurOlWidget
    entitlements:
      path: Sources/MemurOl.entitlements
      properties:
        com.apple.security.application-groups: [group.com.celikgames.memurol]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Memur Ol
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "21"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        LSApplicationQueriesSchemes: [https, http]
        # Arka plan ilan kontrolü (3 saatte bir, iOS uygun zamanı seçer)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.celikgames.memurol.denetim]
        # Apple takip izni penceresindeki açıklama (reklam için zorunlu)
        NSUserTrackingUsageDescription: "Reklamların sana daha uygun olması için kullanılır. İzin vermesen de uygulamanın tamamı ücretsiz çalışır."
        # Google Mobile Ads: şimdilik Google'ın TEST uygulama kimliği; App Store öncesi AdMob'daki iOS kimliğiyle değişecek
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # Firebase Analytics: izin verilene kadar KAPALI, reklam kimliği toplanmaz
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.celikgames.memurol
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, ComposeApp, -ObjC]
        # Kotlin yalnız arm64 simülatör/cihaz için derlenir (Intel simülatörü yok)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Kotlin çerçevesini derle
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  # Ana ekran parçacığı (WidgetKit)
  MemurOlWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    entitlements:
      path: Widget/MemurOlWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.celikgames.memurol]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Memur Ol
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "21"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.celikgames.memurol.pencere
        TARGETED_DEVICE_FAMILY: "1"
