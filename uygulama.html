<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Şartım Tamam</title>
<style>

:root{--zemin:#f5f3f9;--kart:#fff;--ic:#f3f0f8;--yazi:#1c1530;--soluk:#675e78;--cizgi:#e3ddee;--ana:#4b23a0;--ana2:#6a3fd1;--ana-ac:#eee7fc;--vurgu:#ff8a5b;--tamam:#0a7a5c;--tamam-ac:#e2f4ec;--bak:#9a5800;--bak-ac:#fdf0dc;--yok:#b3264a;--yok-ac:#fbe6eb;--ters:#fff;--golge:0 1px 2px rgb(40 20 80/.06),0 4px 14px rgb(40 20 80/.06);--govde:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.ciz-yazi{display:flex;justify-content:space-between;font-size:.82em}.ciz-yazi b{display:block;font-size:1.05em;color:var(--yazi)}

.sart b{display:block;font-weight:600}.sart small{display:block;color:var(--soluk);margin-top:2px}
details>summary{cursor:pointer;font-weight:700;color:var(--ana);padding:8px 0;min-height:40px;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ▾"}details[open]>summary::after{content:" ▴"}
.adim{display:flex;gap:12px;margin:10px 0}.adim i{width:26px;height:26px;border-radius:50%;background:var(--ana-ac);color:var(--ana);font-style:normal;font-weight:800;display:grid;place-items:center;flex:none;font-size:.85em}
.eksik{display:flex;align-items:center;gap:12px;background:var(--bak-ac);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.eksik div{flex:1}.eksik b{display:block}.eksik small{color:var(--bak);font-weight:600}.eksik button{background:var(--ana);color:var(--ters);border-radius:12px;padding:8px 14px;font-weight:700;min-height:40px}
.not{background:var(--ic);border-radius:14px;padding:12px;margin:10px 0;font-size:.92em}
.bos{text-align:center;color:var(--soluk);padding:28px 8px}
.liste-bolum{max-height:260px;overflow:auto;border:1.5px solid var(--cizgi);border-radius:14px;margin-top:8px;background:var(--kart)}

.secili-bolum{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--tamam);background:var(--tamam-ac);border-radius:14px;padding:12px 14px;font-weight:700}
.secili-bolum button{color:var(--ana);font-weight:700}
.puan-buyuk{font-size:2.6em;font-weight:800;text-align:center;letter-spacing:-.02em;padding:6px}
.ust-bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}.ust-bar .geri,.ust-bar .paylas{width:44px;height:44px;border-radius:50%;background:var(--kart);box-shadow:var(--golge);font-size:1.2em}.ust-bar span{flex:1}
.yapiskan{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));display:grid;gap:8px;padding:10px 0;background:linear-gradient(transparent,var(--zemin) 30%)}
.hosgeldin{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.hosgeldin svg.buyuk{width:120px;height:120px;margin-bottom:10px}
.madde{display:flex;gap:12px;align-items:flex-start;margin:12px 0}.madde span{width:34px;height:34px;border-radius:10px;background:var(--ana-ac);color:var(--ana);display:grid;place-items:center;flex:none;font-weight:800}
[hidden]{display:none!important}
</style></head>
<body>
<main id="kok"></main>
<nav class="nav" id="nav" hidden>
  <button data-sekme="ilanlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>İlanlar</button>
  <button data-sekme="uygun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Sana uygun<span class="rozet-n" id="navSayi" hidden></span></button>
  <button data-sekme="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
</nav>

<script>
'use strict';
const $ = id => document.getElementById(id), K = $('kok');
const el = (tur, ozellik = {}, ...cocuk) => {
  const e = document.createElement(tur);
  for (const [a, v] of Object.entries(ozellik)) {
    if (v == null || v === false) continue;
    if (a === 'class') e.className = v; else if (a === 'text') e.textContent = v;
    else if (a.startsWith('on')) e[a] = v; else e.setAttribute(a, v === true ? '' : v);
  }
  for (const c of cocuk.flat()) if (c != null && c !== false) e.append(c);
  return e;
};
const oku = (k, v) => Depo.oku(k, v), yaz = (k, v) => Depo.yaz(k, v);
// Yeni ilan bildirimleri: ntfy kanalı (ücretsiz ntfy uygulamasıyla abone olunur; kişisel bilgi gitmez)
const BILDIRIM = 'https://ntfy.sh/sartimtamam-l1mnao9by2';
const bildirimKart = () => el('a', { class: 'kart', href: BILDIRIM, target: '_blank', rel: 'noopener', style: 'display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit' },
  el('span', { style: 'font-size:1.6em', text: '🔔' }),
  el('span', {}, el('b', { text: 'Yeni ilan bildirimi al' }), el('div', { class: 'soluk kucuk', text: 'Ücretsiz ntfy uygulamasını kur, açılan sayfada "Abone ol" de. Yeni ilan gelince telefonuna bildirim düşer.' })));
const kucuk = Motor.kucuk;
const LOGO = '<svg viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="12" fill="#4b23a0"/><rect x="11" y="11" width="26" height="26" rx="7" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3" opacity=".7"/><path d="m16 25 6 6 11-13" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="9" r="5" fill="#ff8a5b"/></svg>';
const logo = (ek = '') => { const s = el('span', { class: 'marka' }); s.innerHTML = LOGO; s.append(el('span', {}, 'Şartım ', el('b', { text: 'Tamam' }))); if (ek) s.append(ek); return s };

let profil = oku('kisiler', [])[0] || null;
let ilanlar = [], guncel = null, yuklendi = false;
let taslak = null, adim = 0, sekme = 'ilanlar', ara = '', suzgec = 'hepsi';

// ---------- Hesap: ilan → pozisyonlar (kadro bazında) ----------
const onbellek = new WeakMap();
const sure = x => x._S || (x._S = Sure.durum(Sure.bul(x.metin)));
const ozet = x => x._O || (x._O = Ozet.ozetle(x));
const SAY = s => s.filter(x => ['tamam', 'bak', 'yok'].includes(x.durum));
function pozisyonlar(x, p) {
  let o = onbellek.get(x);
  const imza = JSON.stringify(p);
  if (o && o.imza === imza) return o.L;
  const S = sure(x), t = S.son ? S.son.zaman : new Date(), O = ozet(x), L = [];
  const ilkDefaEngel = O.ilkDefa && p.kadrolu === 'evet';
  if (x.duyuru) {
    // Kariyer Kapısı beslemesinden gelen ilan: metni yok, şartlar ve son gün ilanın kendi sayfasında
    L.push({ x, ad: konu(x), grup: 'bak', sartlar: [], neden: "Kariyer Kapısı ilanı: son gün ve şartlar ilanın sayfasında.", adet: null });
  } else if (x.eksik) {
    L.push({ x, ad: konu(x), grup: 'bak', sartlar: [], neden: 'Tablosu resim olarak basılmış; şartları ilanın aslından kontrol et.', adet: O.kisi });
  } else if (x.B && x.B.kadrolar && x.B.kadrolar.length) {
    const r = Bolucu.degerlendir(x.B, p, t), tercih = Il.tercihler(p.iller || '').iller;
    r.kadrolar.forEach((k, i) => {
      if (Ozet.akademik(k.ad)) return;   // akademik kadrolar (profesör, doçent...) değerlendirilmiyor
      let g = k.grup, neden = k.neden;
      if (g === 'belge') g = 'bak';
      if (g === 'bolum') { g = 'uymuyor'; neden = 'Bölümün bu kadroda geçmiyor.' }
      const il = x.B.ilHarita && x.B.ilHarita[i];
      let ildeki = null;
      if (tercih.length && il && g !== 'uymuyor') { ildeki = tercih.reduce((n, a) => n + (il[a] || 0), 0); if (!ildeki) { g = 'uymuyor'; neden = 'Seçtiğin illerde bu kadro yok.' } }
      if (ilkDefaEngel) { g = 'uymuyor'; neden = 'İlk defa atanacaklar için; kadrolu memurlar başvuramaz.' }
      L.push({ x, k, i, ad: k.ad, grup: g, sartlar: k.sartlar, neden, adet: k.adet, ildeki, kpssPuan: k.kpssPuan, ortak: r.ortakOku });
    });
  } else {
    const r = Motor.incele(x.metin, p, t);
    let g = r.sonuc === 'uygun' ? 'uygun' : r.sonuc === 'bak' ? 'bak' : 'uymuyor';
    const yok = r.satirlar.filter(s => s.durum === 'yok').map(s => s.not);
    const ilkBak = r.satirlar.find(s => s.durum === 'bak' && !/otomatik anlayamadım/.test(s.not));
    let neden = g === 'uymuyor' ? yok[0] : g === 'bak' ? (ilkBak ? ilkBak.not : 'Kontrol etmen gereken şartlar var.') : 'Bütün şartları tutuyor.';
    const b = Motor.bolumAd(p.bolum || '');
    if (g === 'bak' && r.satirlar.some(s => s.tur === 'bolum' && s.durum === 'bak') && b.length > 2 && !kucuk(x.metin).includes(b)) { g = 'uymuyor'; neden = 'Bölümün ilanda geçmiyor.' }
    if (ilkDefaEngel) { g = 'uymuyor'; neden = 'İlk defa atanacaklar için; kadrolu memurlar başvuramaz.' }
    L.push({ x, ad: konu(x), grup: g, sartlar: r.satirlar.filter(s => s.durum !== 'bilgi'), neden, adet: O.kisi, tablosuz: true });
  }
  onbellek.set(x, { imza, L });
  return L;
}
// "KURUM: İLK DEFA ATANMAK ÜZERE ZABITA MEMURU ALIM İLANI" → "İlk Defa Atanmak Üzere Zabıta Memuru Alım İlanı"
const buyukHarf = s => s.toLocaleLowerCase('tr-TR').replace(/(^|[\s(/-])(\S)/g, (m, a, b) => a + b.toLocaleUpperCase('tr-TR')).replace(/\b(Ve|İle|Veya)\b/g, w => w.toLocaleLowerCase('tr-TR'));
const kurumAd = x => String(x.ad).split(':')[0].trim();
const konu = x => { const k = String(x.ad).split(':').slice(1).join(':').trim(); return k ? buyukHarf(k) : kurumAd(x) };
