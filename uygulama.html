<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Şartım Tamam</title>
<style>
/* Şartım Tamam — az yazı, çok işaret: renk, simge, halka. Karşılama → 5 adım → İlanlar / Sana uygun / Profil → ayrıntı */
:root{--zemin:#f6f4fb;--kart:#fff;--ic:#f1eef8;--yazi:#1b1530;--soluk:#6e6583;--cizgi:#e6e1f0;--ana:#4a24b8;--ana2:#7048e8;--koyu:#241164;--ana-ac:#efe9ff;--mercan:#ff6f4f;--mercan-yazi:#d2401f;--mercan-ac:#ffece7;--tamam:#08795a;--tamam-ac:#e1f6ee;--bak:#985400;--bak-ac:#fff2dc;--yok:#b3264a;--yok-ac:#fde8ec;--ters:#fff;--golge:0 1px 2px rgb(36 17 100/.05),0 6px 18px rgb(36 17 100/.07);--govde:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--zemin:#100c19;--kart:#1b1627;--ic:#241e33;--yazi:#f1ecfa;--soluk:#a99fbc;--cizgi:#322a44;--ana:#b9a2ff;--ana2:#9b7dff;--koyu:#0c0717;--ana-ac:#2a2142;--mercan:#ff8a6f;--mercan-yazi:#ff8a6f;--mercan-ac:#3a231e;--tamam:#4fd3a2;--tamam-ac:#12302a;--bak:#f4b55c;--bak-ac:#33281a;--yok:#ff8aa0;--yok-ac:#3a1f28;--ters:#100c19;--golge:none;color-scheme:dark}}
:root[data-theme="dark"]{--zemin:#100c19;--kart:#1b1627;--ic:#241e33;--yazi:#f1ecfa;--soluk:#a99fbc;--cizgi:#322a44;--ana:#b9a2ff;--ana2:#9b7dff;--koyu:#0c0717;--ana-ac:#2a2142;--mercan:#ff8a6f;--mercan-yazi:#ff8a6f;--mercan-ac:#3a231e;--tamam:#4fd3a2;--tamam-ac:#12302a;--bak:#f4b55c;--bak-ac:#33281a;--yok:#ff8aa0;--yok-ac:#3a1f28;--ters:#100c19;--golge:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--zemin);color:var(--yazi);font:16px/1.4 var(--govde);-webkit-text-size-adjust:100%;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
body.alt-yok{padding-bottom:calc(118px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
h1{font-size:1.65em;line-height:1.12;margin:4px 0 4px;letter-spacing:-.025em;font-weight:800}
h2{display:flex;align-items:center;gap:8px;font-size:1.05em;margin:22px 0 10px;font-weight:800;letter-spacing:-.01em}
h2 .say{margin-left:auto;font-size:.8em;color:var(--soluk);font-weight:700}
p{margin:6px 0}.soluk{color:var(--soluk)}.kucuk{font-size:.85em}
.ik{display:inline-grid;place-items:center;flex:none}.ik svg{width:1.15em;height:1.15em}
.nokta{width:10px;height:10px;border-radius:50%;flex:none}.n-uygun{background:var(--tamam)}.n-bak{background:var(--bak)}.n-uymuyor{background:var(--cizgi)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--yazi);width:100%;padding:12px 14px;border:1.5px solid var(--cizgi);border-radius:14px;background:var(--kart);min-height:50px}
input:focus,select:focus{outline:none;border-color:var(--ana2)}
:focus-visible{outline:3px solid var(--mercan);outline-offset:2px}
.kart{background:var(--kart);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--golge)}

/* Marka */
.ust{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.marka{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.12em;letter-spacing:-.02em;flex:1}.marka b{color:var(--mercan-yazi)}
.marka svg{width:36px;height:36px;flex:none}
.yuvarlak{width:44px;height:44px;border-radius:50%;background:var(--kart);box-shadow:var(--golge);display:grid;place-items:center;color:var(--ana);text-decoration:none}
.yuvarlak.zil-acik{background:var(--ana);color:#fff}

/* Düğmeler */
.birincil{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;background:linear-gradient(135deg,var(--ana2),var(--ana));color:#fff;font-weight:700;font-size:1.05em;text-decoration:none;box-shadow:0 6px 16px rgb(74 36 184/.25)}
:root:not([data-theme="light"]) .birincil{color:#fff}
.birincil:disabled{opacity:.4;box-shadow:none}
.ikincil{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:16px;background:var(--ana-ac);color:var(--ana);font-weight:700;text-decoration:none}
.metin-d{color:var(--ana);font-weight:700;padding:10px 0;min-height:44px;display:inline-flex;align-items:center;gap:6px}

/* Seçimler (bilgi adımları) */
.secenek{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.secenek>button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border:1.5px solid var(--cizgi);border-radius:18px;background:var(--kart);min-height:84px;font-weight:700}
.secenek>button small{display:block;font-weight:500;color:var(--soluk);font-size:.8em}
.secenek>button[aria-pressed="true"]{border-color:var(--ana2);background:var(--ana-ac);color:var(--ana)}
.secenek .simge{width:38px;height:38px;border-radius:12px;background:var(--ic);display:grid;place-items:center;color:var(--ana)}
.secenek>button[aria-pressed="true"] .simge{background:var(--ana);color:#fff}
.cipler{display:flex;gap:8px;flex-wrap:wrap}
.cipler>button{padding:9px 15px;border:1.5px solid var(--cizgi);border-radius:999px;background:var(--kart);font-weight:700;min-height:42px}
.cipler>button[aria-pressed="true"]{background:var(--ana);border-color:var(--ana);color:#fff}
.kaydir{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}.kaydir::-webkit-scrollbar{display:none}.kaydir>button{flex:none}
.alan{margin-top:20px}.alan>.etiket{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:10px}
.ipucu{display:block;color:var(--soluk);margin-top:6px;font-size:.82em}
.ilerleme{display:flex;gap:6px;flex:1}.ilerleme i{flex:1;height:6px;border-radius:9px;background:var(--cizgi)}.ilerleme i.dolu{background:linear-gradient(90deg,var(--ana2),var(--ana))}
.sihir-ust{display:flex;align-items:center;gap:14px;margin-bottom:18px}.sihir-ust .geri{width:42px;height:42px;border-radius:14px;background:var(--kart);box-shadow:var(--golge);display:grid;place-items:center}
.adim-simge{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--ana2),var(--ana));color:#fff;display:grid;place-items:center;margin-bottom:12px}.adim-simge svg{width:28px;height:28px}
.alt-cubuk{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--kart) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--cizgi);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.alt-cubuk>div{max-width:640px;margin:auto}
.sayac{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:10px;font-size:.9em}
.sayac b{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px}.sayac .u{background:var(--tamam-ac);color:var(--tamam)}.sayac .k{background:var(--bak-ac);color:var(--bak)}
.liste-bolum{max-height:260px;overflow:auto;border:1.5px solid var(--cizgi);border-radius:14px;margin-top:8px;background:var(--kart)}
.liste-bolum button{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--cizgi)}.liste-bolum button:first-child{border-top:0}
.secili-bolum{display:flex;align-items:center;gap:10px;border:1.5px solid var(--tamam);background:var(--tamam-ac);border-radius:14px;padding:12px 14px;font-weight:800;color:var(--tamam)}
.secili-bolum>span+span{flex:1;color:var(--yazi)}.secili-bolum button{color:var(--ana);font-weight:700}
.puan-buyuk{font-size:2.8em;font-weight:800;text-align:center;letter-spacing:-.02em;padding:6px;min-height:80px}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--kart) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--cizgi);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:213px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:.74em;font-weight:700;color:var(--soluk);position:relative}
.nav button svg{width:24px;height:24px}.nav button[aria-current="page"]{color:var(--ana)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--ana)}
.nav .rozet-n{position:absolute;top:5px;left:calc(50% + 8px);background:var(--tamam);color:var(--ters);border-radius:99px;font-size:.85em;padding:0 6px;font-weight:800;line-height:1.5}

/* Ana sayfa kahramanı */
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--ana2),var(--ana) 55%,var(--koyu));color:#fff;border-radius:24px;padding:18px;display:flex;align-items:center;gap:16px;width:100%;text-align:left;box-shadow:0 10px 24px rgb(74 36 184/.28)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgb(255 255 255/.08)}
.hero .bilgi{flex:1;position:relative;z-index:1}.hero .etk{font-size:.78em;opacity:.8;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero .satir{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:700}.hero .satir b{font-size:1.4em}
.hero .git{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;background:rgb(255 255 255/.18);display:grid;place-items:center}
.halka{position:relative;flex:none}.halka b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7em;font-weight:800;line-height:1}
.halka b small{display:block;font-size:.38em;font-weight:700;opacity:.85;margin-top:2px}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--soluk);font-size:.84em;font-weight:600;margin:12px 2px 4px}.meta span{display:inline-flex;align-items:center;gap:5px}
.arama{position:relative;margin-top:12px}.arama .ik{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soluk)}.arama input{padding-left:42px;border-radius:16px}

/* İlan / pozisyon kartı */
.ilan{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--kart);border-radius:18px;padding:12px;margin-bottom:9px;box-shadow:var(--golge);position:relative}
.ilan::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--renk,transparent)}
.ilan.g-uygun{--renk:var(--tamam)}.ilan.g-bak{--renk:var(--bak)}
.takvim{width:48px;height:52px;flex:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ana-ac);color:var(--ana);line-height:1}
.takvim i{font-style:normal;font-size:.62em;font-weight:800;letter-spacing:.06em}.takvim b{font-size:1.35em;font-weight:800;margin-top:3px}
.takvim.acil{background:var(--yok-ac);color:var(--yok)}.takvim.yakin{background:var(--bak-ac);color:var(--bak)}
.ilan .govde{flex:1;min-width:0}
.ilan .baslik{font-weight:800;font-size:1em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ilan .kurum{font-size:.84em;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ilan .alt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.78em;color:var(--soluk);font-weight:600;margin-top:5px}.ilan .alt span{display:inline-flex;align-items:center;gap:4px}
.ilan .sag{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.hap{display:inline-flex;align-items:center;gap:4px;font-size:.74em;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.hap.uygun{background:var(--tamam-ac);color:var(--tamam)}.hap.bak{background:var(--bak-ac);color:var(--bak)}.hap.uymuyor{background:var(--ic);color:var(--soluk)}
.hap.yeni{background:#d2401f;color:#fff}
.mini{display:flex;gap:3px;margin-top:6px}.mini i{width:14px;height:5px;border-radius:9px;background:var(--cizgi)}.mini i.t{background:var(--tamam)}.mini i.b{background:var(--bak)}.mini i.y{background:var(--yok)}

/* Sana uygun */
.ozet3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ozet3>div{background:var(--kart);border-radius:20px;padding:14px;box-shadow:var(--golge);display:flex;align-items:center;gap:12px}
.ozet3 .rakam{font-size:1.9em;font-weight:800;line-height:1}.ozet3 .ad{font-size:.82em;color:var(--soluk);font-weight:700}
.rk{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}.rk svg{width:22px;height:22px}
.rk.u{background:var(--tamam-ac);color:var(--tamam)}.rk.k{background:var(--bak-ac);color:var(--bak)}
.tamlik{display:flex;align-items:center;gap:12px}.tamlik .cubuk{flex:1;height:8px;border-radius:9px;background:var(--cizgi);overflow:hidden}.tamlik .cubuk i{display:block;height:100%;background:linear-gradient(90deg,var(--mercan),var(--ana2))}
.tamlik b{font-size:.9em}
.eksikler{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.eksikler button{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--ana2);color:var(--ana);background:var(--ana-ac);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.88em}
.eksikler button small{background:var(--kart);border-radius:99px;padding:0 7px;font-weight:800}

/* Ayrıntı */
.bant{position:relative;margin:-12px -16px 0;padding:max(12px,env(safe-area-inset-top)) 16px 18px;background:linear-gradient(160deg,var(--ana-ac),var(--zemin) 85%)}
.ust-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}.ust-bar span{flex:1}
.etiketler{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.etiketler>span{display:inline-flex;align-items:center;gap:5px;background:var(--kart);border-radius:999px;padding:5px 11px;font-size:.8em;font-weight:700;color:var(--soluk);box-shadow:var(--golge)}
.kurum-ust{color:var(--ana);font-weight:800;font-size:.86em;display:flex;align-items:center;gap:6px}
.karar{display:flex;align-items:center;gap:16px;border-radius:22px;padding:16px;margin:14px 0 12px}
.karar.uygun{background:var(--tamam-ac);color:var(--tamam)}.karar.bak{background:var(--bak-ac);color:var(--bak)}.karar.uymuyor{background:var(--yok-ac);color:var(--yok)}
.karar h3{font-size:1.25em;margin:0;font-weight:800}.karar p{margin:3px 0 0;color:var(--yazi);font-size:.9em}
.bilgi-satir{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--cizgi)}.bilgi-satir:first-child{border-top:0;padding-top:0}
.bilgi-satir .rk{width:36px;height:36px;border-radius:12px;background:var(--ana-ac);color:var(--ana)}.bilgi-satir .rk svg{width:18px;height:18px}
.bilgi-satir b{display:block;font-size:.78em;color:var(--soluk);font-weight:700;margin-bottom:1px}
.zaman{display:flex;align-items:center;gap:12px}
.ciz{position:relative;height:8px;background:var(--cizgi);border-radius:9px;margin:14px 2px 8px}.ciz i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--ana2),var(--mercan))}
.ciz-yazi{display:flex;justify-content:space-between;font-size:.8em;color:var(--soluk);font-weight:600}.ciz-yazi b{display:block;color:var(--yazi);font-size:1.05em}
details.sart{border-top:1px solid var(--cizgi)}details.sart:first-of-type{border-top:0}
details.sart>summary{display:flex;gap:12px;align-items:center;padding:11px 0;list-style:none;cursor:pointer;font-weight:600}
details.sart>summary::-webkit-details-marker{display:none}
details.sart>summary .ac{margin-left:auto;color:var(--soluk);transition:transform .2s}details.sart[open]>summary .ac{transform:rotate(90deg)}
details.sart p{margin:0 0 12px 38px;color:var(--soluk);font-size:.84em;font-style:italic}
.s-ik{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}.s-ik svg{width:15px;height:15px}
.s-tamam .s-ik{background:var(--tamam)}.s-bak .s-ik{background:var(--bak)}.s-yok .s-ik{background:var(--yok)}
details.acilir>summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;color:var(--ana);padding:10px 0;list-style:none}
details.acilir>summary::-webkit-details-marker{display:none}details.acilir>summary .ac{transition:transform .2s}details.acilir[open]>summary .ac{transform:rotate(90deg)}
.adimlar{display:flex;flex-direction:column;gap:10px}
.adim{display:flex;gap:12px;align-items:center}.adim i{width:30px;height:30px;border-radius:10px;background:var(--ana-ac);color:var(--ana);font-style:normal;font-weight:800;display:grid;place-items:center;flex:none;font-size:.85em}
.yapiskan{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));display:grid;gap:8px;padding:12px 0 6px;background:linear-gradient(transparent,var(--zemin) 28%)}
.bos{text-align:center;color:var(--soluk);padding:26px 8px}
.bos .ik svg{width:42px;height:42px;opacity:.5}

/* Karşılama */
.hosgeldin{min-height:86vh;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center}
.hosgeldin .logo-buyuk svg{width:112px;height:112px;filter:drop-shadow(0 14px 24px rgb(74 36 184/.3))}
.hosgeldin h1{font-size:2em;margin-top:22px}.hosgeldin h1 b{background:linear-gradient(90deg,var(--ana2),var(--mercan));-webkit-background-clip:text;background-clip:text;color:transparent}
.ozellik{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:26px 0}
.ozellik div{background:var(--kart);border-radius:18px;padding:14px 8px;box-shadow:var(--golge);font-weight:700;font-size:.85em;display:flex;flex-direction:column;align-items:center;gap:8px}
.ozellik .rk{background:var(--ana-ac);color:var(--ana)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<main id="kok"></main>
<nav class="nav" id="nav" hidden>
  <button data-sekme="ilanlar"><span data-ik="liste"></span>İlanlar</button>
  <button data-sekme="uygun"><span data-ik="hedef"></span>Sana uygun<span class="rozet-n" id="navSayi" hidden></span></button>
  <button data-sekme="profil"><span data-ik="kisi"></span>Profil</button>
</nav>
<div class="alt-cubuk" id="alt" hidden><div><div class="sayac" id="sayac" role="status" aria-live="polite"></div><button class="birincil" id="ileri">Devam</button></div></div>
<script src="motor.js"></script>
<script src="il.js"></script>
<script src="sure.js"></script>
<script src="bildirim.js"></script>
<script src="depo.js"></script>
<script src="taban.js"></script>
<script src="taban_veri.js"></script>
<script src="bolucu.js"></script>
<script src="bolumler.js"></script>
<script src="ozet.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), K = $('kok');
const el = (tur, ozellik = {}, ...cocuk) => {
  const e = document.createElement(tur);
  for (const [a, v] of Object.entries(ozellik)) {
    if (v == null || v === false) continue;
    if (a === 'class') e.className = v; else if (a === 'text') e.textContent = v;
    else if (a.startsWith('on')) e[a] = v; else e.setAttribute(a, v === true ? '' : v);
  }
  for (const c of cocuk.flat()) if (c != null && c !== false) e.append(c);
  return e;
};
const oku = (k, v) => Depo.oku(k, v), yaz = (k, v) => Depo.yaz(k, v);
// Dışarıdan gelen (ilan verisindeki) adresler yalnızca https/http ise bağlantı olur (javascript:, intent: vb. engellenir — OWASP)
